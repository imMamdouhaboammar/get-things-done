name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release Bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml pytest

      - name: Validate & Package Skills
        run: |
          python scripts/catalog_stylist.py --validate
          python scripts/package_skills.py --out ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/get-things-done.zip
            dist/building-gtd-domain-packs.zip
          draft: false
          prerelease: false
          generate_release_notes: true
