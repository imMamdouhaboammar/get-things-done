name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate source and distribution contracts
        run: |
          gtd --help
          python scripts/catalog_stylist.py --validate
          python scripts/adapters.py validate
          python -m ruff check scripts tests skills/get-things-done/scripts
          pytest -q

      - name: Package canonical skills
        run: |
          python scripts/package_skills.py --out ./dist

      - name: Build adapter bundles
        run: |
          python scripts/adapters.py export-all --out ./dist/adapters --package --report ./dist/export-report.json
          test -f ./dist/adapters/homebrew.zip
          test -f ./dist/adapters/shell.zip
          test -f ./dist/adapters/codex.zip
          test ! -e ./dist/adapters/glama.zip

      - name: Write and verify release checksums
        run: |
          python scripts/release_checksums.py ./dist --out ./dist/SHA256SUMS
          python scripts/release_checksums.py ./dist/adapters --out ./dist/adapters/SHA256SUMS
          python scripts/release_checksums.py ./dist --verify ./dist/SHA256SUMS
          python scripts/release_checksums.py ./dist/adapters --verify ./dist/adapters/SHA256SUMS

      - name: Write release provenance
        run: |
          python scripts/release_provenance.py             --root .             --dist ./dist             --source-sha "$GITHUB_SHA"             --ref "$GITHUB_REF"             --out ./dist/PROVENANCE.json
          test -s ./dist/PROVENANCE.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/get-things-done.zip
            dist/building-gtd-domain-packs.zip
            dist/gtd-capability-router.zip
            dist/gtd-deliberation.zip
            dist/SHA256SUMS
            dist/PROVENANCE.json
            dist/adapters/*.zip
            dist/adapters/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
