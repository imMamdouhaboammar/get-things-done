name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate Skill Pack (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke installed GTD entrypoint
        run: |
          gtd --help

      - name: Bytecode Compilation Check
        run: |
          python -m compileall scripts tests skills/get-things-done/scripts

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Validate Behavioral Evaluation Contracts
        run: |
          python scripts/behavioral_evals.py validate-suite evals/cases.jsonl
          python scripts/behavioral_evals.py validate-suite evals/domain-routing-cases.jsonl

      - name: Ruff Static Quality Gate
        run: |
          python -m ruff check scripts tests skills/get-things-done/scripts

      - name: Capability Router Security Regression
        run: |
          pytest -q tests/test_capability_router_security.py

      - name: Deliberation Security Regression
        run: |
          pytest -q tests/test_deliberation_security.py

      - name: Self-Updater Security Regression
        run: |
          pytest -q tests/test_updater.py tests/test_updater_security.py

      - name: Validate Skill Catalog Assets & Invariants
        run: |
          python scripts/catalog_stylist.py --validate

      - name: Validate Host Adapter Contracts
        run: |
          python scripts/adapters.py validate
          python scripts/adapters.py status
          python scripts/adapters.py capabilities
          python scripts/adapters.py companions
          python scripts/adapters.py interop context7

      - name: Smoke All Host Exports
        run: |
          python scripts/adapters.py export-all --out ./dist/adapters --package --report ./dist/export-report.json
          test -f ./dist/export-report.json
          test -f ./dist/adapters/cursor/.cursor/skills/get-things-done/SKILL.md
          test -f ./dist/adapters/antigravity/.gemini/config/skills/get-things-done/SKILL.md
          test -f ./dist/adapters/kimi/kimi.plugin.json
          test -f ./dist/adapters/chatgpt-plugin/.codex-plugin/plugin.json
          test -f ./dist/adapters/claude-marketplace/.claude-plugin/marketplace.json
          test -f ./dist/adapters/homebrew/Formula/get-things-done.rb
          test -f ./dist/adapters/shell/install.sh
          test -f ./dist/adapters/shell/skills/get-things-done/SKILL.md
          test -f ./dist/adapters/shell/skills/gtd-deliberation/SKILL.md
          test -f ./dist/adapters/homebrew.zip
          test -f ./dist/adapters/shell.zip
          test -f ./dist/adapters/codex.zip
          test ! -e ./dist/adapters/glama
          test ! -e ./dist/adapters/glama.zip

      - name: Verify Release Checksums Generation and Verification
        run: |
          python scripts/release_checksums.py ./dist/adapters --out ./dist/adapters/SHA256SUMS
          python scripts/release_checksums.py ./dist/adapters --verify ./dist/adapters/SHA256SUMS

      - name: Run GTD CLI Doctor
        run: |
          python scripts/gtd.py doctor

      - name: Verify Packaging Pipeline
        run: |
          python scripts/gtd.py package --out ./dist
          test -f ./dist/get-things-done.zip
          test -f ./dist/building-gtd-domain-packs.zip
          test -f ./dist/gtd-capability-router.zip
          test -f ./dist/gtd-deliberation.zip

      - name: Verify Install Script Syntax
        run: |
          bash -n install.sh

      - name: Verify Homebrew Formula Syntax
        run: |
          ruby -c Formula/get-things-done.rb
