[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "get-things-done-skillpack"
version = "1.1.0"
description = "Turn messy intent into executable work models with explicit decisions, readiness checks, and completion evidence for AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Mamdouh Aboammar", email = "mamdouhfces1997@gmail.com" }
]
keywords = [
    "ai-agent",
    "agent-skills",
    "gtd",
    "execution",
    "workflow",
    "chatgpt",
    "codex",
    "claude-code",
    "antigravity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
gtd = "scripts.gtd:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
