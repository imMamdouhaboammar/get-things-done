[package]
name = "use-chatgpt-engine"
version = "1.0.0"
edition = "2021"
authors = ["Mamdouh Aboammar <imMamdouhaboammar@gmail.com>"]
description = "Pure Rust agentic routing, state machine, and macOS CLI execution engine for Use-ChatGPT skill"
license = "MIT"

[[bin]]
name = "chatgpt-skill"
path = "src/main.rs"

[lib]
name = "use_chatgpt_engine"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
which = "6.0"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
